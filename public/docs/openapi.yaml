paths:
  /register:
    get:
      summary: 'Halaman Registrasi'
      operationId: halamanRegistrasi
      description: 'Menampilkan halaman formulir pendaftaran pengguna baru.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "<!DOCTYPE html>\n<html lang=\"en\">\n    <head>\n        <meta charset=\"utf-8\">\n        <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n        <meta name=\"csrf-token\" content=\"s9I7BpFZgR94mXn1lFFM1VcHQtmeimXTE3M5t0BE\">\n\n        <title>Garuda</title>\n        <link rel=\"icon\" type=\"image/svg+xml\" href=\"http://127.0.0.1:8000/images/logo.svg\">\n\n        <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n        <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n        <link href=\"https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap\" rel=\"stylesheet\">\n        <link rel=\"preload\" as=\"style\" href=\"http://127.0.0.1:8000/build/assets/app-CNV64zgk.css\" /><link rel=\"stylesheet\" href=\"http://127.0.0.1:8000/build/assets/app-CNV64zgk.css\" data-navigate-track=\"reload\" />                    <link rel=\"modulepreload\" as=\"script\" href=\"http://127.0.0.1:8000/build/assets/app-DVI7KK-T.js\" /><script type=\"module\" src=\"http://127.0.0.1:8000/build/assets/app-DVI7KK-T.js\" data-navigate-track=\"reload\"></script>                \n        <style>[x-cloak] { display: none !important; }</style>\n    </head>\n    <body\n        class=\"bg-cover bg-center bg-fixed bg-no-repeat\"\n        style=\"background-image: url('http://127.0.0.1:8000/images/WhatsApp Image 2026-06-14 at 16.52.35.webp');\">\n            \n            \n            <main>\n                <div class=\"min-h-screen flex items-center justify-center px-4 py-8\">\n    <div class=\"card p-8 max-w-sm w-full\">\n\n        \n        <div class=\"text-center mb-6\">\n            <svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" class=\"mx-auto text-primary\">\n                <path d=\"M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z\"/>\n            </svg>\n            <h1 class=\"font-display text-headline-md text-primary mt-2\">Garuda</h1>\n        </div>\n\n        \n        <h2 class=\"font-display text-headline-sm text-primary mb-1\">Buat Akun Baru</h2>\n        <p class=\"text-body-sm text-tertiary mb-6\">Daftar sekarang dan mulai pesan tiket penerbangan</p>\n\n        <form method=\"POST\" action=\"http://127.0.0.1:8000/register\">\n            <input type=\"hidden\" name=\"_token\" value=\"s9I7BpFZgR94mXn1lFFM1VcHQtmeimXTE3M5t0BE\" autocomplete=\"off\">\n            \n            <div class=\"mb-4\">\n                <label for=\"name\" class=\"text-label-sm text-tertiary mb-1 block\">Nama Lengkap</label>\n                <div class=\"relative\">\n                    <input id=\"name\" type=\"text\" name=\"name\" value=\"\" required autofocus autocomplete=\"name\" placeholder=\"Nama lengkap\"\n                        class=\"input-field  pl-10\">\n                    <svg class=\"absolute left-3 top-1/2 -translate-y-1/2 text-tertiary pointer-events-none\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                        <path d=\"M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2\"/>\n                        <circle cx=\"12\" cy=\"7\" r=\"4\"/>\n                    </svg>\n                </div>\n                            </div>\n\n            \n            <div class=\"mb-4\">\n                <label for=\"email\" class=\"text-label-sm text-tertiary mb-1 block\">Email</label>\n                <div class=\"relative\">\n                    <input id=\"email\" type=\"email\" name=\"email\" value=\"\" required autocomplete=\"username\" placeholder=\"contoh@email.com\"\n                        class=\"input-field  pl-10\">\n                    <svg class=\"absolute left-3 top-1/2 -translate-y-1/2 text-tertiary pointer-events-none\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                        <rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"/>\n                        <path d=\"M22 7l-10 7L2 7\"/>\n                    </svg>\n                </div>\n                            </div>\n\n            \n            <div class=\"mb-4\">\n                <label for=\"password\" class=\"text-label-sm text-tertiary mb-1 block\">Kata Sandi</label>\n                <div class=\"relative\">\n                    <input id=\"password\" type=\"password\" name=\"password\" required autocomplete=\"new-password\" placeholder=\"Buat kata sandi\"\n                        class=\"input-field  pl-10\">\n                    <svg class=\"absolute left-3 top-1/2 -translate-y-1/2 text-tertiary pointer-events-none\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                        <rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\" ry=\"2\"/>\n                        <path d=\"M7 11V7a5 5 0 0110 0v4\"/>\n                    </svg>\n                </div>\n                            </div>\n\n            \n            <div class=\"mb-6\">\n                <label for=\"password_confirmation\" class=\"text-label-sm text-tertiary mb-1 block\">Konfirmasi Kata Sandi</label>\n                <div class=\"relative\">\n                    <input id=\"password_confirmation\" type=\"password\" name=\"password_confirmation\" required autocomplete=\"new-password\" placeholder=\"Ulangi kata sandi\"\n                        class=\"input-field  pl-10\">\n                    <svg class=\"absolute left-3 top-1/2 -translate-y-1/2 text-tertiary pointer-events-none\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                        <rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\" ry=\"2\"/>\n                        <path d=\"M7 11V7a5 5 0 0110 0v4\"/>\n                    </svg>\n                </div>\n                            </div>\n\n            \n            <button type=\"submit\" class=\"btn-primary w-full\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                    <path d=\"M5 13l4 4L19 7\"/>\n                </svg>\n                Daftar\n            </button>\n        </form>\n\n        \n        <p class=\"text-center mt-4 text-body-sm text-tertiary\">\n            Sudah punya akun? <a href=\"http://127.0.0.1:8000/login\" class=\"text-nav-link text-primary hover:text-secondary transition-colors\">Masuk di sini</a>\n        </p>\n\n    </div>\n</div>\n            </main>\n        </div>\n\n        <!-- Global Toast Notifications Container -->\n        <div id=\"globalToastContainer\" class=\"fixed top-5 right-5 z-[100] flex flex-col gap-3 w-full max-w-sm pointer-events-none\"></div>\n\n        <!-- Global Confirmation Modal Container -->\n        <div \n            id=\"globalConfirmModal\" \n            class=\"fixed inset-0 z-[150] hidden items-center justify-center overflow-y-auto\"\n        >\n            <!-- Overlay -->\n            <div \n                onclick=\"window.closeGlobalConfirm()\" \n                class=\"fixed inset-0 bg-black/60 backdrop-blur-sm\"\n            ></div>\n\n            <!-- Modal Content -->\n            <div class=\"relative bg-surface rounded-2xl max-w-md w-full mx-4 p-6 shadow-2xl border border-border/80 z-10 space-y-6\">\n                <div class=\"flex items-start gap-4\">\n                    <!-- Alert Warning Icon -->\n                    <div class=\"shrink-0 w-10 h-10 rounded-full bg-rose-50 dark:bg-rose-950/30 flex items-center justify-center text-rose-600 dark:text-rose-400\">\n                        <svg class=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z\"/></svg>\n                    </div>\n                    <div class=\"space-y-1\">\n                        <h3 id=\"globalConfirmTitle\" class=\"font-display text-headline-sm text-primary\">Konfirmasi</h3>\n                        <p id=\"globalConfirmMessage\" class=\"text-body-md text-tertiary\">Apakah Anda yakin?</p>\n                    </div>\n                </div>\n\n                <div class=\"flex justify-end gap-3\">\n                    <button \n                        onclick=\"window.closeGlobalConfirm()\"\n                        class=\"px-5 py-2.5 rounded-full border border-border text-on-surface hover:bg-neutral transition-colors text-label-lg font-semibold\"\n                    >\n                        Batal\n                    </button>\n                    <button \n                        id=\"globalConfirmBtn\"\n                        class=\"px-5 py-2.5 rounded-full bg-rose-600 hover:bg-rose-700 text-surface transition-colors text-label-lg font-semibold\"\n                    >\n                        Ya, Batalkan\n                    </button>\n                </div>\n            </div>\n        </div>\n\n        <script>\n            // Global Toast Notification function\n            window.showNotification = function(type, message) {\n                const container = document.getElementById('globalToastContainer');\n                if (!container) return;\n                const id = Date.now();\n                \n                let bgClass = '';\n                let iconSvg = '';\n                let progressBg = '';\n                \n                if (type === 'success') {\n                    bgClass = 'bg-emerald-50/95 border-emerald-200 text-emerald-800 dark:bg-emerald-950/95 dark:border-emerald-800 dark:text-emerald-200';\n                    iconSvg = '<svg class=\"w-5 h-5 text-emerald-600 dark:text-emerald-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z\"/></svg>';\n                    progressBg = 'bg-emerald-500';\n                } else if (type === 'error' || type === 'danger') {\n                    bgClass = 'bg-rose-50/95 border-rose-200 text-rose-800 dark:bg-rose-950/95 dark:border-rose-800 dark:text-rose-200';\n                    iconSvg = '<svg class=\"w-5 h-5 text-rose-600 dark:text-rose-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z\"/></svg>';\n                    progressBg = 'bg-rose-500';\n                } else if (type === 'warning') {\n                    bgClass = 'bg-amber-50/95 border-amber-200 text-amber-800 dark:bg-amber-950/95 dark:border-amber-800 dark:text-amber-200';\n                    iconSvg = '<svg class=\"w-5 h-5 text-amber-600 dark:text-amber-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z\"/></svg>';\n                    progressBg = 'bg-amber-500';\n                } else {\n                    bgClass = 'bg-sky-50/95 border-sky-200 text-sky-800 dark:bg-sky-950/95 dark:border-sky-800 dark:text-sky-200';\n                    iconSvg = '<svg class=\"w-5 h-5 text-sky-600 dark:text-sky-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z\"/></svg>';\n                    progressBg = 'bg-sky-500';\n                }\n\n                const toast = document.createElement('div');\n                toast.id = `toast-${id}`;\n                toast.className = `relative flex gap-3 p-4 rounded-xl border shadow-lg backdrop-blur-md pointer-events-auto overflow-hidden transition-all duration-300 transform translate-x-full opacity-0 ${bgClass}`;\n                toast.innerHTML = `\n                    <div class=\"shrink-0\">${iconSvg}</div>\n                    <div class=\"flex-1\">\n                        <p class=\"text-sm font-semibold leading-5\">${message}</p>\n                    </div>\n                    <button onclick=\"document.getElementById('toast-${id}').remove()\" class=\"shrink-0 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors\">\n                        <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6 18L18 6M6 6l12 12\"/></svg>\n                    </button>\n                    <div class=\"absolute bottom-0 left-0 h-1 ${progressBg}\" style=\"width: 100%; transition: width 5000ms linear;\"></div>\n                `;\n                \n                container.appendChild(toast);\n                \n                setTimeout(() => {\n                    toast.classList.remove('translate-x-full', 'opacity-0');\n                    toast.classList.add('translate-x-0', 'opacity-100');\n                    const progress = toast.querySelector('div:last-child');\n                    if (progress) progress.style.width = '0%';\n                }, 50);\n                \n                setTimeout(() => {\n                    if (document.getElementById(`toast-${id}`)) {\n                        toast.classList.remove('translate-x-0', 'opacity-100');\n                        toast.classList.add('translate-x-full', 'opacity-0');\n                        setTimeout(() => toast.remove(), 300);\n                    }\n                }, 5000);\n            };\n\n            // Global Confirmation Modal function\n            let globalConfirmCallback = null;\n\n            window.showConfirm = function(title, message, callback) {\n                document.getElementById('globalConfirmTitle').textContent = title;\n                document.getElementById('globalConfirmMessage').textContent = message;\n                globalConfirmCallback = callback;\n                \n                const modal = document.getElementById('globalConfirmModal');\n                modal.classList.remove('hidden');\n                modal.classList.add('flex');\n            };\n\n            window.closeGlobalConfirm = function() {\n                const modal = document.getElementById('globalConfirmModal');\n                modal.classList.remove('flex');\n                modal.classList.add('hidden');\n                globalConfirmCallback = null;\n            };\n\n            document.getElementById('globalConfirmBtn').addEventListener('click', () => {\n                if (globalConfirmCallback) {\n                    globalConfirmCallback();\n                }\n                window.closeGlobalConfirm();\n            });\n\n            // Trigger session alerts automatically on page load\n            document.addEventListener('DOMContentLoaded', () => {\n                                                            });\n        </script>\n\n        \n            </body>\n</html>\n"
      tags:
        - Autentikasi
      security: []
    post:
      summary: 'Proses Registrasi'
      operationId: prosesRegistrasi
      description: 'Mendaftarkan pengguna baru ke dalam sistem.'
      parameters: []
      responses: {  }
      tags:
        - Autentikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nama lengkap pengguna.'
                  example: 'John Doe'
                email:
                  type: string
                  description: 'Alamat email unik pengguna.'
                  example: john@example.com
                password:
                  type: string
                  description: 'Password akun minimal 8 karakter.'
                  example: password
                password_confirmation:
                  type: string
                  description: 'Konfirmasi password.'
                  example: password
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /login:
    get:
      summary: 'Halaman Login'
      operationId: halamanLogin
      description: 'Menampilkan halaman formulir login pengguna.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: "<!DOCTYPE html>\n<html lang=\"en\">\n    <head>\n        <meta charset=\"utf-8\">\n        <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n        <meta name=\"csrf-token\" content=\"s9I7BpFZgR94mXn1lFFM1VcHQtmeimXTE3M5t0BE\">\n\n        <title>Garuda</title>\n        <link rel=\"icon\" type=\"image/svg+xml\" href=\"http://127.0.0.1:8000/images/logo.svg\">\n\n        <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n        <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n        <link href=\"https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap\" rel=\"stylesheet\">\n        <link rel=\"preload\" as=\"style\" href=\"http://127.0.0.1:8000/build/assets/app-CNV64zgk.css\" /><link rel=\"stylesheet\" href=\"http://127.0.0.1:8000/build/assets/app-CNV64zgk.css\" data-navigate-track=\"reload\" />                    <link rel=\"modulepreload\" as=\"script\" href=\"http://127.0.0.1:8000/build/assets/app-DVI7KK-T.js\" /><script type=\"module\" src=\"http://127.0.0.1:8000/build/assets/app-DVI7KK-T.js\" data-navigate-track=\"reload\"></script>                \n        <style>[x-cloak] { display: none !important; }</style>\n    </head>\n    <body\n        class=\"bg-cover bg-center bg-fixed bg-no-repeat\"\n        style=\"background-image: url('http://127.0.0.1:8000/images/WhatsApp Image 2026-06-14 at 16.52.35.webp');\">\n            \n            \n            <main>\n                <div class=\"min-h-screen flex items-center justify-center px-4 py-8\">\n    <div class=\"card p-8 max-w-sm w-full\">\n\n        \n        <div class=\"text-center mb-6\">\n            <svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" class=\"mx-auto text-primary\">\n                <path d=\"M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z\"/>\n            </svg>\n            <h1 class=\"font-display text-headline-md text-primary mt-2\">Garuda</h1>\n        </div>\n\n        \n        <h2 class=\"font-display text-headline-sm text-primary mb-1\">Masuk</h2>\n        <p class=\"text-body-sm text-tertiary mb-6\">Pesan tiket penerbangan impianmu sekarang</p>\n\n        \n        \n        <form method=\"POST\" action=\"http://127.0.0.1:8000/login\">\n            <input type=\"hidden\" name=\"_token\" value=\"s9I7BpFZgR94mXn1lFFM1VcHQtmeimXTE3M5t0BE\" autocomplete=\"off\">\n            \n            <div class=\"mb-4\">\n                <label for=\"email\" class=\"text-label-sm text-tertiary mb-1 block\">Email</label>\n                <div class=\"relative\">\n                    <input id=\"email\" type=\"email\" name=\"email\" value=\"\" required autofocus autocomplete=\"username\" placeholder=\"contoh@email.com\"\n                        class=\"input-field  pl-10\">\n                    <svg class=\"absolute left-3 top-1/2 -translate-y-1/2 text-tertiary pointer-events-none\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                        <path d=\"M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2\"/>\n                        <circle cx=\"12\" cy=\"7\" r=\"4\"/>\n                    </svg>\n                </div>\n                            </div>\n\n            \n            <div class=\"mb-4\">\n                <label for=\"password\" class=\"text-label-sm text-tertiary mb-1 block\">Kata Sandi</label>\n                <div class=\"relative\">\n                    <input id=\"password\" type=\"password\" name=\"password\" required autocomplete=\"current-password\" placeholder=\"Masukkan kata sandi\"\n                        class=\"input-field  pl-10\">\n                    <svg class=\"absolute left-3 top-1/2 -translate-y-1/2 text-tertiary pointer-events-none\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                        <rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\" ry=\"2\"/>\n                        <path d=\"M7 11V7a5 5 0 0110 0v4\"/>\n                    </svg>\n                </div>\n                            </div>\n\n            \n            <div class=\"flex items-center justify-between mb-6\">\n                <label class=\"flex items-center gap-2 cursor-pointer\">\n                    <input type=\"checkbox\" name=\"remember\" id=\"remember_me\" class=\"accent-primary rounded border-border\">\n                    <span class=\"text-body-sm text-tertiary\">Ingat saya</span>\n                </label>\n                                    <a href=\"http://127.0.0.1:8000/forgot-password\" class=\"text-nav-link text-primary hover:text-secondary transition-colors\">Lupa kata sandi?</a>\n                            </div>\n\n            \n            <button type=\"submit\" class=\"btn-primary w-full\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n                    <path d=\"M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M13 12H3\"/>\n                </svg>\n                Masuk\n            </button>\n        </form>\n\n        \n                    <p class=\"text-center mt-4 text-body-sm text-tertiary\">\n                Belum punya akun? <a href=\"http://127.0.0.1:8000/register\" class=\"text-nav-link text-primary hover:text-secondary transition-colors\">Daftar di sini</a>\n            </p>\n        \n    </div>\n</div>\n            </main>\n        </div>\n\n        <!-- Global Toast Notifications Container -->\n        <div id=\"globalToastContainer\" class=\"fixed top-5 right-5 z-[100] flex flex-col gap-3 w-full max-w-sm pointer-events-none\"></div>\n\n        <!-- Global Confirmation Modal Container -->\n        <div \n            id=\"globalConfirmModal\" \n            class=\"fixed inset-0 z-[150] hidden items-center justify-center overflow-y-auto\"\n        >\n            <!-- Overlay -->\n            <div \n                onclick=\"window.closeGlobalConfirm()\" \n                class=\"fixed inset-0 bg-black/60 backdrop-blur-sm\"\n            ></div>\n\n            <!-- Modal Content -->\n            <div class=\"relative bg-surface rounded-2xl max-w-md w-full mx-4 p-6 shadow-2xl border border-border/80 z-10 space-y-6\">\n                <div class=\"flex items-start gap-4\">\n                    <!-- Alert Warning Icon -->\n                    <div class=\"shrink-0 w-10 h-10 rounded-full bg-rose-50 dark:bg-rose-950/30 flex items-center justify-center text-rose-600 dark:text-rose-400\">\n                        <svg class=\"w-5 h-5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z\"/></svg>\n                    </div>\n                    <div class=\"space-y-1\">\n                        <h3 id=\"globalConfirmTitle\" class=\"font-display text-headline-sm text-primary\">Konfirmasi</h3>\n                        <p id=\"globalConfirmMessage\" class=\"text-body-md text-tertiary\">Apakah Anda yakin?</p>\n                    </div>\n                </div>\n\n                <div class=\"flex justify-end gap-3\">\n                    <button \n                        onclick=\"window.closeGlobalConfirm()\"\n                        class=\"px-5 py-2.5 rounded-full border border-border text-on-surface hover:bg-neutral transition-colors text-label-lg font-semibold\"\n                    >\n                        Batal\n                    </button>\n                    <button \n                        id=\"globalConfirmBtn\"\n                        class=\"px-5 py-2.5 rounded-full bg-rose-600 hover:bg-rose-700 text-surface transition-colors text-label-lg font-semibold\"\n                    >\n                        Ya, Batalkan\n                    </button>\n                </div>\n            </div>\n        </div>\n\n        <script>\n            // Global Toast Notification function\n            window.showNotification = function(type, message) {\n                const container = document.getElementById('globalToastContainer');\n                if (!container) return;\n                const id = Date.now();\n                \n                let bgClass = '';\n                let iconSvg = '';\n                let progressBg = '';\n                \n                if (type === 'success') {\n                    bgClass = 'bg-emerald-50/95 border-emerald-200 text-emerald-800 dark:bg-emerald-950/95 dark:border-emerald-800 dark:text-emerald-200';\n                    iconSvg = '<svg class=\"w-5 h-5 text-emerald-600 dark:text-emerald-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z\"/></svg>';\n                    progressBg = 'bg-emerald-500';\n                } else if (type === 'error' || type === 'danger') {\n                    bgClass = 'bg-rose-50/95 border-rose-200 text-rose-800 dark:bg-rose-950/95 dark:border-rose-800 dark:text-rose-200';\n                    iconSvg = '<svg class=\"w-5 h-5 text-rose-600 dark:text-rose-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z\"/></svg>';\n                    progressBg = 'bg-rose-500';\n                } else if (type === 'warning') {\n                    bgClass = 'bg-amber-50/95 border-amber-200 text-amber-800 dark:bg-amber-950/95 dark:border-amber-800 dark:text-amber-200';\n                    iconSvg = '<svg class=\"w-5 h-5 text-amber-600 dark:text-amber-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z\"/></svg>';\n                    progressBg = 'bg-amber-500';\n                } else {\n                    bgClass = 'bg-sky-50/95 border-sky-200 text-sky-800 dark:bg-sky-950/95 dark:border-sky-800 dark:text-sky-200';\n                    iconSvg = '<svg class=\"w-5 h-5 text-sky-600 dark:text-sky-400\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z\"/></svg>';\n                    progressBg = 'bg-sky-500';\n                }\n\n                const toast = document.createElement('div');\n                toast.id = `toast-${id}`;\n                toast.className = `relative flex gap-3 p-4 rounded-xl border shadow-lg backdrop-blur-md pointer-events-auto overflow-hidden transition-all duration-300 transform translate-x-full opacity-0 ${bgClass}`;\n                toast.innerHTML = `\n                    <div class=\"shrink-0\">${iconSvg}</div>\n                    <div class=\"flex-1\">\n                        <p class=\"text-sm font-semibold leading-5\">${message}</p>\n                    </div>\n                    <button onclick=\"document.getElementById('toast-${id}').remove()\" class=\"shrink-0 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors\">\n                        <svg class=\"w-4 h-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M6 18L18 6M6 6l12 12\"/></svg>\n                    </button>\n                    <div class=\"absolute bottom-0 left-0 h-1 ${progressBg}\" style=\"width: 100%; transition: width 5000ms linear;\"></div>\n                `;\n                \n                container.appendChild(toast);\n                \n                setTimeout(() => {\n                    toast.classList.remove('translate-x-full', 'opacity-0');\n                    toast.classList.add('translate-x-0', 'opacity-100');\n                    const progress = toast.querySelector('div:last-child');\n                    if (progress) progress.style.width = '0%';\n                }, 50);\n                \n                setTimeout(() => {\n                    if (document.getElementById(`toast-${id}`)) {\n                        toast.classList.remove('translate-x-0', 'opacity-100');\n                        toast.classList.add('translate-x-full', 'opacity-0');\n                        setTimeout(() => toast.remove(), 300);\n                    }\n                }, 5000);\n            };\n\n            // Global Confirmation Modal function\n            let globalConfirmCallback = null;\n\n            window.showConfirm = function(title, message, callback) {\n                document.getElementById('globalConfirmTitle').textContent = title;\n                document.getElementById('globalConfirmMessage').textContent = message;\n                globalConfirmCallback = callback;\n                \n                const modal = document.getElementById('globalConfirmModal');\n                modal.classList.remove('hidden');\n                modal.classList.add('flex');\n            };\n\n            window.closeGlobalConfirm = function() {\n                const modal = document.getElementById('globalConfirmModal');\n                modal.classList.remove('flex');\n                modal.classList.add('hidden');\n                globalConfirmCallback = null;\n            };\n\n            document.getElementById('globalConfirmBtn').addEventListener('click', () => {\n                if (globalConfirmCallback) {\n                    globalConfirmCallback();\n                }\n                window.closeGlobalConfirm();\n            });\n\n            // Trigger session alerts automatically on page load\n            document.addEventListener('DOMContentLoaded', () => {\n                                                            });\n        </script>\n\n        \n            </body>\n</html>\n"
